name: New Terraform workspace infra

on:
  workflow_dispatch

jobs:
  new-terraform-infra-limiting-resource:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-south-1

      - name: Set Terraform Workspace
        id: workspace
        run: |
          if [[ "${GITHUB_REF##*/}" == "Master" ]]; then
            echo "::set-output name=workspace::production"
          elif [[ "${GITHUB_REF##*/}" == "development" ]]; then
            echo "::set-output name=workspace::development"
          elif [[ "${GITHUB_REF##*/}" == "staging" ]]; then
            echo "::set-output name=workspace::staging"
          else
            echo "::set-output name=workspace::default"
          fi

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform workspace new ${{ env.workspace }} || terraform workspace select ${{ env.workspace }}
          terraform plan

      - name: Terraform Apply
        run: |
          terraform workspace new ${{ env.workspace }} || terraform workspace select ${{ env.workspace }}
          terraform apply -auto-approve
        timeout-minutes: 60  # Add a timeout to prevent indefinite running
